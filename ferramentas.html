<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a10"><title>Ferramentas úteis | ODEVI+</title>
<style>
:root{color-scheme:dark;--bg:#080a10;--panel:#11141d;--border:#2a303c;--text:#f5f7fb;--muted:#a7afbd;--green:#68f39a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 18px 60px}a{color:var(--green)}header{margin:8px 0 28px}header a{display:inline-block;margin-bottom:18px}h1{font-size:clamp(28px,6vw,40px);line-height:1.15;margin:0 0 10px}h2{font-size:24px;margin-top:0}p{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;margin:22px 0;scroll-margin-top:12px}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:#090c13;color:var(--text);font:inherit}button,.button{display:inline-block;border:0;border-radius:10px;background:var(--green);color:#07110b;padding:12px 16px;font-weight:750;font-size:15px;text-decoration:none;cursor:pointer;margin:12px 8px 0 0}button.secondary{background:#252b36;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.checks label{display:flex;gap:10px;align-items:flex-start;font-weight:450}.checks input{width:auto;margin-top:7px}.result{margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:10px}.small{font-size:13px}.cv-preview{background:#fff;color:#151515;padding:22px;border-radius:8px;white-space:pre-wrap;min-height:100px}.cv-preview p{color:#333}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:16px}}
@media print{body{background:#fff;color:#111}.wrap{max-width:none;padding:0}.panel{background:#fff;color:#111;border:0;box-shadow:none}.panel p,.small{color:#333}body *{visibility:hidden}#documentos,#documentos *{visibility:visible}#documentos{position:absolute;left:0;top:0;width:100%}#documentos button{display:none}a{color:#111}}@media print{body.print-cv *{visibility:hidden}body.print-cv #curriculo,body.print-cv #curriculo *{visibility:visible}body.print-cv #curriculo{position:absolute;left:0;top:0;width:100%}body.print-cv #curriculo button,body.print-cv #curriculo label,body.print-cv #curriculo input,body.print-cv #curriculo textarea,body.print-cv #curriculo .grid{display:none!important}body.print-cv #cvPreview{background:#fff;color:#111}}</head><body><main class="wrap"><header><a href="index.html">← Voltar ao ODEVI+</a><h1>Ferramentas úteis</h1><p>Recursos práticos para organizar documentos, converter moedas e preparar o teu currículo. Verifica sempre a informação oficial antes de tomar decisões.</p></header>
<section class="panel" id="documentos"><h2>📋 Preparar documentos</h2><p>Seleciona a lista que mais se aproxima do teu objetivo. A lista é geral: os documentos exigidos dependem da tua nacionalidade e do procedimento.</p><label for="tipoLista">Objetivo</label><select id="tipoLista"><option value="passaporte">Renovar passaporte brasileiro em Portugal</option><option value="residencia">Visto ou residência em Portugal</option><option value="trabalho">Procurar trabalho</option><option value="estudo">Estudar em Portugal</option><option value="consular">Serviço consular</option></select><div id="listaDocs" class="checks"></div><p id="linksPassaporte" class="small"><a href="https://ec-londres.itamaraty.gov.br/" target="_blank" rel="noopener noreferrer">e-Consular de Londres ↗</a> · <a href="https://www.gov.br/mre/pt-br/consulado-londres" target="_blank" rel="noopener noreferrer">Consulado-Geral do Brasil em Londres ↗</a></p><div id="progresso" class="result" aria-live="polite">0 itens concluídos</div><button id="imprimirLista">Imprimir / guardar PDF</button><button class="secondary" id="limparLista">Desmarcar tudo</button><p class="small">Esta ferramenta não guarda os dados num servidor. A lista pode ser impressa através do navegador.</p></section>
<section class="panel" id="moedas"><h2>💱 Conversor de moedas</h2><p>Usa uma taxa de câmbio online quando a ligação ao serviço estiver disponível. O valor é indicativo e pode diferir do aplicado pelo banco ou serviço de transferência.</p><div class="grid"><div><label for="valor">Valor</label><input id="valor" type="number" min="0" step="any" value="100"></div><div><label for="de">De</label><select id="de"><option>EUR</option><option>BRL</option><option>GBP</option><option>USD</option></select></div><div><label for="para">Para</label><select id="para"><option>BRL</option><option>EUR</option><option>GBP</option><option>USD</option></select></div></div><button id="converter">Converter</button><div id="resultadoMoeda" class="result" aria-live="polite">A obter taxas atuais…</div><p id="dataTaxa" class="small"></p></section>
<section class="panel" id="curriculo"><h2>💼 Criar currículo simples</h2><p>Preenche os campos e gera um currículo de uma página. Revê os dados antes de enviar a uma empresa.</p><div class="grid"><div><label for="nome">Nome completo</label><input id="nome" autocomplete="name" placeholder="O teu nome"></div><div><label for="contacto">Contacto / e-mail</label><input id="contacto" placeholder="Telefone ou e-mail"></div><div><label for="local">Cidade / país</label><input id="local" placeholder="Ex.: Londres, Reino Unido"></div><div><label for="cargo">Função pretendida</label><input id="cargo" placeholder="Ex.: Assistente de armazém"></div></div><label for="resumo">Perfil profissional</label><textarea id="resumo" rows="3" placeholder="Resume a tua experiência e os teus pontos fortes."></textarea><label for="experiencia">Experiência profissional</label><textarea id="experiencia" rows="5" placeholder="Função — empresa — datas&#10;Responsabilidades e resultados"></textarea><label for="educacao">Formação e certificados</label><textarea id="educacao" rows="3" placeholder="Curso, escola, certificado"></textarea><label for="idiomas">Idiomas e competências</label><textarea id="idiomas" rows="3" placeholder="Idiomas, carta de condução, competências relevantes"></textarea><button id="gerarCv">Gerar currículo</button><button class="secondary" id="imprimirCv">Imprimir / guardar PDF</button><div id="cvPreview" class="cv-preview" aria-live="polite">O teu currículo aparecerá aqui.</div></section>
<p class="small">ODEVI+ é um projeto independente e não representa entidades públicas. As taxas cambiais são indicativas; os documentos e requisitos devem ser confirmados nas fontes oficiais.</p></main>
<script>
const lists={passaporte:["Confirmei no e-Consular o serviço correto para passaporte","Preenchi o formulário eletrónico conforme as instruções oficiais","Separei documento de identificação brasileiro e passaporte anterior, se aplicável","Verifiquei certidões ou documentos adicionais exigidos para a minha situação","Preparei fotografia e comprovativos apenas conforme as instruções consulares","Confirmei taxa, forma de pagamento e regras de entrega/recolha","Guardei o comprovativo e as instruções do pedido"],residencia:["Passaporte ou documento de viagem válido","Formulário/requerimento aplicável ao procedimento","Fotografias, se exigidas","Comprovativo de alojamento, se exigido","Comprovativos de meios financeiros, se exigidos","Seguro ou cobertura de saúde, se exigidos","Documentos de apoio ao objetivo do pedido","Agendamento, pagamento ou comprovativo aplicável"],trabalho:["Currículo atualizado","Documento de identificação válido","Contactos e referências profissionais","Comprovativos de experiência e formação","Certificados relevantes para a função","Verificação de autorização de trabalho aplicável"],estudo:["Documento de identificação/passaporte","Carta de admissão ou matrícula","Comprovativos financeiros exigidos","Alojamento, se exigido","Seguro/cobertura de saúde, se exigidos","Certificados e histórico escolar","Verificação dos requisitos oficiais do visto"],consular:["Documento de identificação válido","Formulário do serviço consular","Certidões ou documentos relativos ao pedido","Comprovativo de morada, se exigido","Agendamento e comprovativo de pagamento, se aplicável"]};
const tipo=document.getElementById('tipoLista'), lista=document.getElementById('listaDocs'), progresso=document.getElementById('progresso');
function renderLista(){lista.replaceChildren();document.getElementById('linksPassaporte').hidden=tipo.value!=='passaporte';lists[tipo.value].forEach((item,i)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.dataset.item=String(i);const span=document.createElement('span');span.textContent=item;label.append(input,span);lista.append(label);input.addEventListener('change',updateProgress)});updateProgress()}
function updateProgress(){const all=lista.querySelectorAll('input[type=checkbox]'),done=lista.querySelectorAll('input:checked').length;progresso.textContent=done+' de '+all.length+' itens concluídos';}
tipo.addEventListener('change',renderLista);renderLista();
document.getElementById('limparLista').addEventListener('click',()=>{lista.querySelectorAll('input').forEach(x=>x.checked=false);updateProgress()});
document.getElementById('imprimirLista').addEventListener('click',()=>{document.body.classList.remove('print-cv');window.print()});
let rates={EUR:1,BRL:null,GBP:null,USD:null},rateDate='';
async function loadRates(){try{const response=await fetch('https://open.er-api.com/v6/latest/EUR');if(!response.ok)throw Error();const data=await response.json();if(data.result!=='success')throw Error();rates={...data.rates,EUR:1};rateDate=data.time_last_update_utc||'';document.getElementById('dataTaxa').textContent='Última atualização indicada pelo serviço: '+rateDate;convert()}catch(e){document.getElementById('resultadoMoeda').textContent='Não foi possível obter taxas atuais. Verifica a ligação à internet e tenta novamente.'}}
function convert(){const val=Number(document.getElementById('valor').value),from=document.getElementById('de').value,to=document.getElementById('para').value,out=document.getElementById('resultadoMoeda');if(!Number.isFinite(val)||val<0){out.textContent='Introduz um valor válido.';return}if(!rates[from]||!rates[to]){out.textContent='Taxas indisponíveis neste momento. Tenta novamente mais tarde.';return}const result=val/rates[from]*rates[to];out.textContent=new Intl.NumberFormat('pt-PT',{style:'currency',currency:to,maximumFractionDigits:2}).format(result)+' (taxa indicativa; sem comissões)'}
document.getElementById('converter').addEventListener('click',convert);['valor','de','para'].forEach(id=>document.getElementById(id).addEventListener('change',convert));loadRates();
function value(id){return document.getElementById(id).value.trim()}
document.getElementById('gerarCv').addEventListener('click',()=>{const fields=[['nome',''],['contacto',''],['local',''],['cargo',''],['resumo','Perfil profissional'],['experiencia','Experiência profissional'],['educacao','Formação e certificados'],['idiomas','Idiomas e competências']];const preview=document.getElementById('cvPreview');preview.replaceChildren();const h=document.createElement('h2');h.textContent=value('nome')||'Nome completo';preview.append(h);const meta=[value('cargo'),value('local'),value('contacto')].filter(Boolean);if(meta.length){const p=document.createElement('p');p.textContent=meta.join(' · ');preview.append(p)}fields.slice(4).forEach(([id,title])=>{if(!value(id))return;const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=value(id);preview.append(h,p)});if(!preview.children.length)preview.textContent='Preenche os campos acima para gerar o currículo.'});
document.getElementById('imprimirCv').addEventListener('click',()=>{document.body.classList.add('print-cv');window.print()});window.addEventListener('afterprint',()=>document.body.classList.remove('print-cv'));
</script></body></html>
