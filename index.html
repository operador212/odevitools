<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ODEVI+ - Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #00ff88;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 17px;
      margin-bottom: 35px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      background: #111;
      padding: 10px;
      border: 1px solid #292929;
      border-radius: 14px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
      padding: 14px;
    }

    .search-box button {
      border: none;
      border-radius: 10px;
      background: #00ff88;
      color: #000;
      font-weight: 700;
      padding: 0 22px;
      cursor: pointer;
      font-size: 15px;
    }

    .search-box button:hover {
      opacity: 0.85;
    }

    .result {
      display: none;
      margin-top: 30px;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 20px;
    }

    .result-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result-link {
      color: #00ff88;
      font-size: 14px;
      word-break: break-all;
      margin-bottom: 25px;
    }

    .format {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 18px 0;
      border-top: 1px solid #242424;
    }

    .format-name {
      font-size: 17px;
      font-weight: 700;
    }

    .format-info {
      color: #888;
      font-size: 13px;
      margin-top: 5px;
    }

    .format button {
      flex-shrink: 0;
      background: white;
      color: black;
      border: none;
      border-radius: 9px;
      padding: 11px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .format button:hover {
      background: #00ff88;
    }

    .status {
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #555;
      padding: 30px 20px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 45px 15px;
      }

      h1 {
        font-size: 34px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        height: 48px;
      }

      .format {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ODEVI<span>+</span></div>
  </header>

  <main class="container">

    <h1>Download videos<br>with ODEVI+</h1>

    <p class="subtitle">
      Paste your video link and download it in your preferred format.
    </p>

    <div class="search-box">
      <input
        id="urlInput"
        type="text"
        placeholder="Paste your video link here..."
      >

      <button onclick="processLink()">
        Detect
      </button>
    </div>

    <div id="result" class="result">

      <div class="result-title">
        Link detected
      </div>

      <div id="resultLink" class="result-link"></div>

      <div class="format">

        <div>
          <div class="format-name">
            MP4 Video
          </div>

          <div class="format-info">
            High quality video
          </div>
        </div>

        <button onclick="downloadMedia('mp4')">
          Continue
        </button>

      </div>

      <div class="format">

        <div>
          <div class="format-name">
            Audio
          </div>

          <div class="format-info">
            MP3 audio
          </div>
        </div>

        <button onclick="downloadMedia('mp3')">
          Continue
        </button>

      </div>

      <div id="status" class="status"></div>

    </div>

  </main>

  <footer>
    © 2026 ODEVI+
  </footer>

  <script>

    function processLink() {

      const input = document.getElementById("urlInput");
      const result = document.getElementById("result");
      const resultLink = document.getElementById("resultLink");

      const url = input.value.trim();

      if (!url) {
        alert("Please paste a video link first.");
        return;
      }

      resultLink.textContent = url;

      result.style.display = "block";

      result.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }


    async function downloadMedia(format) {

      const input = document.getElementById("urlInput");
      const status = document.getElementById("status");

      const url = input.value.trim();

      if (!url) {
        alert("Please paste a video link first.");
        return;
      }

      status.textContent = "Preparing your download...";

      try {

        const response = await fetch(
          "https://odevi-backend.onrender.com/download",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              url: url,
              format: format
            })
          }
        );

        if (!response.ok) {
          throw new Error(
            "Download failed. Server returned " + response.status
          );
        }

        const blob = await response.blob();

        const downloadUrl = window.URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = downloadUrl;

        link.download =
          format === "mp3"
            ? "odevi-audio.mp3"
            : "odevi-video.mp4";

        document.body.appendChild(link);

        link.click();

        link.remove();

        window.URL.revokeObjectURL(downloadUrl);

        status.textContent = "Download started.";

      } catch (error) {

        console.error(error);

        status.textContent = "";

        alert(
          "Unable to download the video. Please try again."
        );
      }
    }

  </script>

</body>
</html>
