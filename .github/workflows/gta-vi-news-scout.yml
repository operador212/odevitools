name: ODEVI GTA VI News Scout

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gta-vi-news-scout.yml"
      - "scripts/update_gta_news.py"
      - "scripts/update_gta_shorts.py"
      - "config/youtube-channels.json"

permissions:
  contents: write

concurrency:
  group: odevi-gta6-news-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect Rockstar and selected international GTA VI press RSS drafts
        run: python3 scripts/update_gta_news.py
      - name: Refresh YouTube Shorts gallery from public channel RSS feeds
        run: python3 scripts/update_gta_shorts.py
      - name: Commit new drafts
        run: |
          if git diff --quiet -- data/gta-news.json data/gta-shorts.json; then
            echo "No new drafts to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gta-news.json data/gta-shorts.json
          git commit -m "chore: collect GTA VI news drafts"
          git push
