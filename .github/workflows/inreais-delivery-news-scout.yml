name: INREAIS Delivery News Scout

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inreais-delivery-news-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Collect public UK delivery news headlines
        run: python3 scripts/inreais_delivery_scout.py
      - name: Commit editorial review queue
        run: |
          if git diff --quiet -- data/inreais-delivery-news.json; then
            echo "No new headline changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inreais-delivery-news.json
          git commit -m "chore: refresh Inreais delivery news queue"
          git push
