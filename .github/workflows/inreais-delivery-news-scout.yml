name: INREAIS Delivery News Scout

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inreais-delivery-news-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect delivery news across Brazil, Portugal, UK and Ireland
        run: python3 scripts/inreais_delivery_scout.py
      - name: Commit editorial queue
        run: |
          git add data/inreais-delivery-news.json
          if git diff --cached --quiet -- data/inreais-delivery-news.json; then
            echo "No new headline changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Inreais delivery news queue"
          git push
